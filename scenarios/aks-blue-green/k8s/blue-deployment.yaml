apiVersion: apps/v1
kind: Deployment
metadata:
  name: webstore-blue
  labels:
    app: webstore
    version: blue
spec:
  replicas: 2
  selector:
    matchLabels:
      app: webstore
      version: blue
  template:
    metadata:
      labels:
        app: webstore
        version: blue
    spec:
      containers:
        - name: webstore
          image: acrwebstorestaging.azurecr.io/aks-stub:v1
          ports:
            - containerPort: 3000
          env:
            - name: DEMO_BROKEN_CHECKOUT
              value: "false"
            - name: APPLICATIONINSIGHTS_CONNECTION_STRING
              valueFrom:
                secretKeyRef:
                  name: appi-connection-string
                  key: connectionString
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 30
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"
