name: "Demo: Warm Up Resources"

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "GitHub Actions environment"
        required: true
        default: "demo"
        type: choice
        options:
          - demo
          - staging
      scenarios:
        description: "Which scenarios to warm up"
        required: true
        default: "webstore"
        type: choice
        options:
          - webstore

# Required repository secrets (per environment):
#   AZURE_CLIENT_ID       – App registration / federated credential client ID
#   AZURE_TENANT_ID       – Entra ID tenant
#   AZURE_SUBSCRIPTION_ID – Subscription containing demo resources
#
# Required repository variables (per environment):
#   CONTAINER_APP_NAME    – e.g. ca-webstore-prod
#   RESOURCE_GROUP        – e.g. rg-webstore-prod
#   PSQL_SERVER_NAME      – e.g. psql-webstore-prod

permissions:
  id-token: write
  contents: read

jobs:
  warmup:
    name: Start & verify resources
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - name: Azure Login (OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # ── Webstore (Container Apps) ──────────────────────────
      - name: Start PostgreSQL
        run: |
          set -euo pipefail
          STATE=$(az postgres flexible-server show \
            --name "${{ vars.PSQL_SERVER_NAME }}" \
            --resource-group "${{ vars.RESOURCE_GROUP }}" \
            --query state -o tsv)

          if [ "$STATE" = "Stopped" ]; then
            echo "⏳ Starting PostgreSQL..."
            az postgres flexible-server start \
              --name "${{ vars.PSQL_SERVER_NAME }}" \
              --resource-group "${{ vars.RESOURCE_GROUP }}"
          else
            echo "ℹ️ PostgreSQL current state: $STATE"
          fi

          if [ "$STATE" != "Ready" ]; then
            echo "⏳ Waiting for PostgreSQL to reach Ready state..."
            for i in $(seq 1 30); do
              STATE=$(az postgres flexible-server show \
                --name "${{ vars.PSQL_SERVER_NAME }}" \
                --resource-group "${{ vars.RESOURCE_GROUP }}" \
                --query state -o tsv)
              echo "  Attempt $i: state=$STATE"
              if [ "$STATE" = "Ready" ]; then
                echo "✅ PostgreSQL is Ready"
                break
              fi
              if [ "$i" -eq 30 ]; then
                echo "❌ PostgreSQL did not reach Ready state in time"
                exit 1
              fi
              sleep 10
            done
          else
            echo "✅ PostgreSQL already Ready"
          fi

      - name: Verify webstore health
        run: |
          set -euo pipefail
          APP_URL=$(az containerapp show \
            --name "${{ vars.CONTAINER_APP_NAME }}" \
            --resource-group "${{ vars.RESOURCE_GROUP }}" \
            --query "properties.configuration.ingress.fqdn" -o tsv)

          echo "🔍 Checking webstore at https://${APP_URL}..."
          for i in $(seq 1 12); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
              --connect-timeout 5 --max-time 15 \
              "https://${APP_URL}/api/health")
            echo "  Attempt $i: HTTP $STATUS"
            if [ "$STATUS" = "200" ]; then
              echo "✅ Webstore is healthy"
              exit 0
            fi
            sleep 10
          done
          echo "❌ Webstore health check timed out"
          exit 1

      # ── Summary ────────────────────────────────────────────
      - name: Summary
        run: |
          echo ""
          echo "╔══════════════════════════════════════╗"
          echo "║     🟢 Demo resources are ready!     ║"
          echo "╚══════════════════════════════════════╝"
          echo ""
          echo "Scenarios warmed up: ${{ inputs.scenarios }}"
