name: Deploy Monitoring Infrastructure

# Deploys alert rules to the configured demo resource group when monitoring Bicep changes.
# Uses the same OIDC auth pattern as webstore-demo-break.yml / webstore-demo-reset.yml.

on:
  push:
    branches: [main]
    paths:
      - 'scenarios/webstore-container-apps/infra/monitoring/**/*.bicep'
      - 'scenarios/webstore-container-apps/infra/monitoring/**/*parameters*.json'
  workflow_dispatch: # Allow manual trigger for initial deployment

# Required repository secrets (same as demo workflows):
#   AZURE_CLIENT_ID       – App registration / federated credential client ID
#   AZURE_TENANT_ID       – Entra ID tenant
#   AZURE_SUBSCRIPTION_ID – Subscription containing the demo resources
#
# Required repository variables (set at repo level, NOT environment-scoped):
#   RESOURCE_GROUP           – e.g. rg-webstore-demo
#   APP_INSIGHTS_NAME        – e.g. appi-webstore-demo
#   DEMO_WORKFLOW_ENVIRONMENT – GitHub Actions environment to run under (e.g. 'demo').
#                              MUST be a repository-level variable, not an environment-scoped
#                              variable, because it is evaluated before the environment is
#                              resolved. Defaults to 'staging' if unset.

permissions:
  id-token: write
  contents: read

jobs:
  deploy-monitoring:
    name: Deploy monitoring alerts
    runs-on: ubuntu-latest
    environment: ${{ vars.DEMO_WORKFLOW_ENVIRONMENT != '' && vars.DEMO_WORKFLOW_ENVIRONMENT || 'staging' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Resolve monitoring target
        run: |
          APP_INSIGHTS_NAME="${{ vars.APP_INSIGHTS_NAME }}"
          if [ -z "$APP_INSIGHTS_NAME" ]; then
            APP_INSIGHTS_NAME="appi-webstore-staging"
            echo "⚠️ APP_INSIGHTS_NAME is not set; falling back to $APP_INSIGHTS_NAME"
          fi
          echo "APP_INSIGHTS_NAME=$APP_INSIGHTS_NAME" >> "$GITHUB_ENV"

      - name: Deploy failed-requests alert
        run: |
          echo "📊 Deploying metric alert to ${{ vars.RESOURCE_GROUP }}..."
          az deployment group create \
            --resource-group "${{ vars.RESOURCE_GROUP }}" \
            --template-file scenarios/webstore-container-apps/infra/monitoring/failed-requests-alert.bicep \
            --parameters appInsightsName="$APP_INSIGHTS_NAME" \
            --name "monitoring-$(date +%Y%m%d-%H%M%S)"
          echo "✅ Metric alert deployed"

      - name: Verify alert exists
        run: |
          set -e
          ALERT=$(az monitor metrics alert show \
            --name "Failed Requests - $APP_INSIGHTS_NAME" \
            --resource-group "${{ vars.RESOURCE_GROUP }}" \
            --query "{name:name, enabled:enabled, severity:severity}" \
            -o json)
          echo "Alert status: $ALERT"
          # Fail if the alert JSON is empty or missing the name field
          echo "$ALERT" | jq -e '.name' > /dev/null || { echo "❌ Alert missing or malformed"; exit 1; }
          echo "✅ Alert verified"
